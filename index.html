<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Palette Generator</title>
    <!-- 아이콘 팩 연결 -->
    <link rel="stylesheet" href="[https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css](https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css)">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Color Palette Generator</h1>

        <button id="generate-btn" class="btn-bounce">
            <i class="fas fa-sync-alt"></i> Generate Palette
        </button>

        <div class="palette-container">
            <!-- 딱 5개의 박스만 유지합니다 -->
            <div class="color-box">
                <i class="fas fa-unlock lock-btn"></i>
                <div class="color"></div>
                <div class="color-info"><span class="hex-value">#FFFFFF</span><i class="far fa-copy copy-btn"></i></div>
            </div>
            <div class="color-box">
                <i class="fas fa-unlock lock-btn"></i>
                <div class="color"></div>
                <div class="color-info"><span class="hex-value">#FFFFFF</span><i class="far fa-copy copy-btn"></i></div>
            </div>
            <div class="color-box">
                <i class="fas fa-unlock lock-btn"></i>
                <div class="color"></div>
                <div class="color-info"><span class="hex-value">#FFFFFF</span><i class="far fa-copy copy-btn"></i></div>
            </div>
            <div class="color-box">
                <i class="fas fa-unlock lock-btn"></i>
                <div class="color"></div>
                <div class="color-info"><span class="hex-value">#FFFFFF</span><i class="far fa-copy copy-btn"></i></div>
            </div>
            <div class="color-box">
                <i class="fas fa-unlock lock-btn"></i>
                <div class="color"></div>
                <div class="color-info"><span class="hex-value">#FFFFFF</span><i class="far fa-copy copy-btn"></i></div>
            </div>
        </div>

        <div class="grid-section">
            <h3><i class="fas fa-th"></i> Color Library</h3>
            <div id="color-grid" class="color-grid"></div>
        </div>
    </div>

    <!-- 알림 메시지 상자 -->
    <div id="toast" class="toast">복사되었습니다! 🍒</div>

    <script src="script.js"></script>
</body>
</html>
